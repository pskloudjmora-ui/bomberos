{# Bloque compartido de los reportes APH: causa de la atención/traslado y datos del paciente #}
{% set es_sin_traslado = tipo_reporte in ('aph_no_traslado', 'aph_sin_traslado') %}
<div>
    <label class="block text-xs font-semibold text-slate-400 mb-1">
        {{ 'Causa de la Atención *' if es_sin_traslado else 'Causa del Traslado *' }}
    </label>
    <textarea name="causa_traslado" rows="2" required
        placeholder="{{ 'Describa el motivo por el cual no se realizó el traslado (dolor, trauma, negativa, etc.)' if es_sin_traslado else 'Describa el motivo del traslado (traumatismo, dificultad respiratoria, dolor torácico, etc.)' }}"
        class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1 custom-scrollbar"></textarea>
</div>

{# Datos del Paciente: misma distribución que Atención Pre-Hospitalaria / Traslado Rutinario #}
<div class="border-t border-slate-800/40 pt-4 space-y-3">
    <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Datos del Paciente</span>
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
        <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre Completo del Paciente *</label>
            <input type="text" name="pa_nombre[]" required placeholder="Nombre y Apellido"
                class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Cédula Identidad Paciente</label>
            <input type="text" name="pa_cedula[]" placeholder="ej: V-15666777"
                class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
        </div>
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Edad *</label>
                <input type="number" name="pa_edad[]" required placeholder="Años"
                    class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Género *</label>
                <select name="pa_sexo[]" required
                    class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
                    <option value="Masculino">Masc</option>
                    <option value="Femenino">Fem</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
        </div>
    </div>
    <div class="grid grid-cols-1 gap-4 border-t border-slate-800/40 pt-4">
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Diagnóstico / Condición Clínica del Paciente *</label>
            <textarea name="pa_lesion[]" required rows="2" placeholder="Traumatismo generalizado, quemadura de 2do grado, paro cardiorespiratorio restablecido, crisis hipertensiva..."
                class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1 custom-scrollbar"></textarea>
        </div>
    </div>
</div>
