{# Checkboxes en cascada para equipos contra incendios.
   Variable opcional: equipos_etiqueta (texto del primer check). #}
<div class="grid grid-cols-1 gap-4 border-t border-slate-800/40 pt-4" data-bloque-equipos>
    <label class="inline-flex items-center text-xs text-slate-300 cursor-pointer">
        <input type="checkbox" name="poseia_equipos" data-check-equipos
            class="rounded bg-slate-900 border-slate-800 text-fire-600 focus:ring-fire-500 h-4 w-4">
        <span class="ml-1.5">{{ equipos_etiqueta|default('El inmueble poseía equipos') }}</span>
    </label>

    <div data-grupo-usados class="hidden grid grid-cols-1 gap-4">
        <label class="inline-flex items-center text-xs text-slate-300 cursor-pointer">
            <input type="checkbox" name="fue_usado" data-check-usados disabled
                class="rounded bg-slate-900 border-slate-800 text-fire-600 focus:ring-fire-500 h-4 w-4">
            <span class="ml-1.5">Fueron utilizados</span>
        </label>

        <div data-grupo-detalle-usados class="hidden grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">¿Por quién fue usado?</label>
                <input type="text" name="por_quien_uso" placeholder="Nombre" disabled
                    class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">C.I.</label>
                <input type="text" name="por_quien_ci" placeholder="C.I." disabled
                    class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Tipo de equipo de extinción</label>
                <input type="text" name="tipo_equipo_contra_incendio" placeholder="ej: Extintor PQS, manguera" disabled
                    class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
            </div>
        </div>
    </div>
</div>
