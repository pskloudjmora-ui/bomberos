{# Parámetros técnicos: Incendio de Vegetación / Forestal #}
{% with despacho_adicional=false %}{% include 'reportes/_incendio_despacho.html' %}{% endwith %}
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 border-t border-slate-800/40 pt-4">
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Tipo de Incendio</label>
        <select name="tipo_incendio"
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
            <option value="Vegetación">Vegetación</option>
            <option value="Forestal">Forestal</option>
        </select>
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Equipo Contra Incendio Usado</label>
        <input type="text" name="tipo_equipo_contra_incendio" placeholder="ej: Mochila, batefuego"
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Hora de Control</label>
        <input type="time" step="1" name="hora_control"
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Hora de Extinción Total</label>
        <input type="time" step="1" name="hora_extincion_total"
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
    </div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-slate-800/40 pt-4">
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">% Pérdida por Humo</label>
        <input type="number" name="porcentaje_perdida_humo" placeholder="0-100"
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">% Pérdida Total</label>
        <input type="number" name="porcentaje_perdida_total" placeholder="0-100"
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
    </div>
</div>
<div class="grid grid-cols-1 gap-4 border-t border-slate-800/40 pt-4">
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Litros de Agua Utilizados</label>
        <input type="number" name="litros_agua_utilizados" placeholder="ej: 5000"
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
    </div>
</div>
<div class="grid grid-cols-1 gap-4 border-t border-slate-800/40 pt-4">
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Métodos de Extinción</label>
        <textarea name="metodos_extincion" rows="2" placeholder="Describa los métodos..."
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1 custom-scrollbar"></textarea>
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Técnicas de Extinción</label>
        <textarea name="tecnicas_extincion" rows="2" placeholder="Describa las técnicas..."
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1 custom-scrollbar"></textarea>
    </div>
</div>
<div class="grid grid-cols-1 gap-4 border-t border-slate-800/40 pt-4">
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Evaluación Preliminar del Daño</label>
        <textarea name="evaluacion_preliminar" rows="2" placeholder="Describa el daño observado..."
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1 custom-scrollbar"></textarea>
    </div>
</div>

<div class="border-t border-slate-800/40 pt-4 space-y-2">
    <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Características del Terreno</span>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Tipo de Terreno</label>
            <input type="text" name="tipo_terreno" placeholder="ej: Montañoso, plano"
                class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Tipo de Vegetación</label>
            <input type="text" name="tipo_vegetacion" placeholder="ej: Matorral, bosque seco"
                class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Extensión del Terreno</label>
            <input type="text" name="extension_terreno" placeholder="ej: 2 hectáreas"
                class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Extensión Afectada</label>
            <input type="text" name="extension_terreno_afectada" placeholder="ej: 0.5 hectáreas"
                class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Coordenadas GPS</label>
            <input type="text" name="coordenadas" placeholder="ej: 10.4806° N, 66.9036° W"
                class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
        </div>
    </div>
</div>
