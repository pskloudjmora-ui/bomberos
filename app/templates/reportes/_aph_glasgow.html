{# Escala de Coma de Glasgow (compartida por reportes APH con traslado) #}
<div class="grid grid-cols-1 sm:grid-cols-4 gap-4 border-t border-slate-800/40 pt-4 bg-slate-950/20 p-3 rounded-xl border border-slate-800/30">
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Apertura Ocular (1-4)</label>
        <select name="glasgow_apertura_ocular" onchange="calcularGlasgow()"
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
            <option value="">—</option>
            <option value="4">4 - Espontánea</option>
            <option value="3">3 - Al habla</option>
            <option value="2">2 - Al dolor</option>
            <option value="1">1 - Ninguna</option>
        </select>
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Respuesta Verbal (1-5)</label>
        <select name="glasgow_respuesta_verbal" onchange="calcularGlasgow()"
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
            <option value="">—</option>
            <option value="5">5 - Orientada</option>
            <option value="4">4 - Confusa</option>
            <option value="3">3 - Palabras inapropiadas</option>
            <option value="2">2 - Sonidos incomprensibles</option>
            <option value="1">1 - Ninguna</option>
        </select>
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Respuesta Motora (1-6)</label>
        <select name="glasgow_respuesta_motora" onchange="calcularGlasgow()"
            class="block w-full rounded-xl border-slate-800 bg-slate-950/60 p-3 text-sm text-slate-300 focus:border-fire-500 focus:ring-fire-500 focus:outline-none border focus:ring-1">
            <option value="">—</option>
            <option value="6">6 - Obedece órdenes</option>
            <option value="5">5 - Localiza el dolor</option>
            <option value="4">4 - Retirada al dolor</option>
            <option value="3">3 - Flexión anormal</option>
            <option value="2">2 - Extensión anormal</option>
            <option value="1">1 - Ninguna</option>
        </select>
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Total Glasgow (3-15)</label>
        <input type="number" name="glasgow_total" readonly placeholder="—"
            class="block w-full rounded-xl border-slate-800 bg-slate-900/60 p-3 text-sm text-fire-400 font-bold focus:outline-none border">
    </div>
</div>
