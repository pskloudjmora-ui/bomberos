{# Vehículos involucrados: lista dinámica con datos del vehículo, propietario y conductor #}
<div class="border-t border-slate-800/40 pt-4 space-y-3">
    <div class="flex items-center justify-between">
        <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Vehículos Involucrados</span>
        <button type="button" onclick="agregarVehiculoInvolucrado()"
            class="px-3 py-1 bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 hover:text-white rounded-lg text-xs font-bold transition-all flex items-center space-x-1 cursor-pointer">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>Agregar unidad</span>
        </button>
    </div>
    <div id="contenedor-vehiculos-involucrados" class="space-y-4"></div>
</div>

<template id="plantilla-vehiculo-involucrado">
    <div class="fila-vehiculo-involucrado bg-slate-950/20 p-3 rounded-xl border border-slate-800/60 space-y-3">
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Unidad / Vehículo</span>
            <button type="button" onclick="eliminarVehiculoInvolucrado(this)" class="p-1 text-slate-500 hover:text-red-500 transition-colors">
                <i data-lucide="trash" class="w-4 h-4"></i>
            </button>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Marca</label>
                <input type="text" name="veh_inv_marca[]" placeholder="ej: Toyota"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Modelo</label>
                <input type="text" name="veh_inv_modelo[]" placeholder="ej: Hilux"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Placa</label>
                <input type="text" name="veh_inv_placa[]" placeholder="Placa"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Color</label>
                <input type="text" name="veh_inv_color[]" placeholder="Color"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Año</label>
                <input type="text" name="veh_inv_anio[]" placeholder="ej: 2020"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Tipo de Vehículo</label>
                <input type="text" name="veh_inv_tipo[]" placeholder="ej: Camión, Motocicleta"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Propietario</label>
                <input type="text" name="veh_inv_propietario[]" placeholder="Nombre completo"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">C.I. Propietario</label>
                <input type="text" name="veh_inv_cedula[]" placeholder="V-12345678"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Teléfono Propietario</label>
                <input type="text" name="veh_inv_telefono[]" placeholder="0412-1234567"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Edad Propietario</label>
                <input type="number" name="veh_inv_edad[]" placeholder="Edad"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Conductor</label>
                <input type="text" name="veh_inv_conductor[]" placeholder="Nombre completo"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">C.I. Conductor</label>
                <input type="text" name="veh_inv_conductor_ci[]" placeholder="V-12345678"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Teléfono Conductor</label>
                <input type="text" name="veh_inv_conductor_tel[]" placeholder="0412-1234567"
                    class="block w-full rounded-lg border-slate-800 bg-slate-950/60 p-2 text-xs text-slate-300 focus:border-fire-500 focus:outline-none border focus:ring-1">
            </div>
        </div>
    </div>
</template>
